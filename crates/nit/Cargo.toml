[package]
name = "nit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Commit-level code review for AI coding agents"

[lints]
workspace = true

[dependencies]
annotate-snippets = "0.12.16"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
deadpool-sqlite = "0.14.0"
futures-util = { version = "0.3", default-features = false }
git2 = { version = "0.21", default-features = false, features = [
  "vendored-libgit2",
] }
humansize = "2.1.3"
imara-diff = { version = "0.2.0", default-features = false }
include_dir = "0.7.4"
jiff = "0.2"
mime_guess = "2.0.5"
mimalloc = "0.1"
nit-types = { workspace = true, features = ["clap"] }
rusqlite = "0.40"
rustix = { version = "1.1.5", features = ["event", "fs", "process"] }
serde = { workspace = true }
# Query-string parsing for AppQuery: unlike serde_urlencoded (axum's
# built-in Query), it deserializes a repeated key into a Vec.
serde_html_form = "0.4"
serde_json = "1"
terminal_size = "0.4.4"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27"
tree-sitter-nix = "0.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tungstenite = "0.30"
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
utoipa = "5"
utoipa-axum = "0.2"

[dev-dependencies]
nit-types = { workspace = true, features = ["testing"] }
tempfile = "3"
