[package]
name = "nit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Commit-level code review for AI coding agents"

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-broadcast = "0.7"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
deadpool-sqlite = "0.13.0"
git2 = { version = "0.20", default-features = false }
imara-diff = { version = "0.2.0", default-features = false }
jiff = "0.2"
nit-types = { workspace = true, features = ["clap"] }
rusqlite = "0.38"
serde = { workspace = true }
# Query-string parsing for AppQuery: unlike serde_urlencoded (axum's
# built-in Query), it deserializes a repeated key into a Vec.
serde_html_form = "0.2"
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-nix = "0.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tungstenite = "0.29"
ureq = { version = "3.3.0", default-features = false, features = ["json"] }

[dev-dependencies]
nit-types = { workspace = true, features = ["testing"] }
tempfile = "3"
