[package]
name = "nit-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the shared nit change fold"

[lints]
workspace = true

[lib]
# A cdylib for wasm-bindgen.
crate-type = ["cdylib"]

[dependencies]
imara-diff.workspace = true
nit-document.workspace = true
nit-types.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
workspace-hack.workspace = true

# Loro numbers a replica at random, and getrandom needs this feature for
# its JavaScript backend. rust.nix sets the cfg that selects the backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
