[package]
name = "nit-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the shared nit change fold"

[lints]
workspace = true

[lib]
# A cdylib for wasm-bindgen.
crate-type = ["cdylib"]

[dependencies]
imara-diff = { version = "0.2.0", default-features = false }
nit-document = { workspace = true }
nit-types = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
# Must match flake.nix's pinned wasm-bindgen-cli exactly: a version skew
# between the macro and the CLI produces JS glue that panics at init.
wasm-bindgen = "=0.2.130"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

# Loro numbers a replica at random, and getrandom needs this feature for
# its JavaScript backend. rust.nix sets the cfg that selects the backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
