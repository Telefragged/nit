[package]
name = "nit-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire types shared by the nit server and CLI"

[lints]
workspace = true

[features]
# The `nit` crate turns it on for the CLI's `clap::ValueEnum` derive on
# `Side`.
clap = ["dep:clap"]
# Derives the ts-rs TypeScript bindings. The `gen-types` app and the
# `types-drift` check in flake.nix generate web/src/api/types.gen.ts from them.
ts = ["dep:ts-rs", "ts-rs/no-serde-warnings"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
ts-rs = { workspace = true, optional = true }
utoipa.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
serde_json.workspace = true
