[package]
name = "nit-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire types shared by the nit server and CLI"

[lints]
workspace = true

[features]
# The `nit` crate turns it on for the CLI's `clap::ValueEnum` derive on
# `Side`.
clap = ["dep:clap"]
# Derives the ts-rs TypeScript bindings. The `gen-types` app and the
# `types-drift` check in flake.nix generate web/src/api/types.gen.ts from them.
ts = ["dep:ts-rs", "ts-rs/no-serde-warnings"]

[dependencies]
serde = { workspace = true }
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
ts-rs = { version = "12", optional = true }
utoipa = "5"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_json = "1"
