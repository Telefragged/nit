[workspace]
members = [
  "crates/nit",
  "crates/nit-contract",
  "crates/nit-document",
  "crates/nit-types",
  "crates/nit-wasm",
  "crates/workspace-hack",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
nit = { path = "crates/nit" }
nit-document = { path = "crates/nit-document" }
nit-types = { path = "crates/nit-types" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Suppressions must be #[expect] (flagged when stale) and contain a reason.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Fires on parallel names such as change1/change2 and draft_b/draft_c.
similar_names = "allow"

[workspace.lints.rust]
warnings = "deny"

[profile.dev.package."*"]
opt-level = 3
