[workspace]
members = [
  "crates/nit",
  "crates/nit-contract",
  "crates/nit-document",
  "crates/nit-types",
  "crates/nit-wasm",
  "crates/workspace-hack",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
annotate-snippets = "0.12.16"
anyhow = "1"
axum = "0.8"
blake3 = "1"
clap = "4"
deadpool-sqlite = "0.14.0"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
git2 = { version = "0.21", default-features = false }
humansize = "2.1.3"
imara-diff = { version = "0.2.0", default-features = false }
include_dir = "0.7.4"
jiff = "0.2"
loro = "1.19"
mimalloc = "0.1"
mime_guess = "2.0.5"
nit = { path = "crates/nit" }
nit-document = { path = "crates/nit-document" }
nit-types = { path = "crates/nit-types" }
percent-encoding = "2"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = "0.40"
rustix = "1.1.5"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Query-string parsing for AppQuery: unlike serde_urlencoded (axum's
# built-in Query), it deserializes a repeated key into a Vec.
serde_html_form = "0.4"
serde_json = "1"
similar = "2"
tempfile = "3"
terminal_size = "0.4.4"
thiserror = "2"
tokio = "1"
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = "12"
tungstenite = "0.30"
ureq = { version = "3.3.0", default-features = false }
utoipa = "5"
utoipa-axum = "0.2"
# Must match flake.nix's pinned wasm-bindgen-cli exactly: a version skew
# between the macro and the CLI produces JS glue that panics at init.
wasm-bindgen = "=0.2.130"
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Suppressions must be #[expect] (flagged when stale) and contain a reason.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Fires on parallel names such as change1/change2 and draft_b/draft_c.
similar_names = "allow"

[workspace.lints.rust]
warnings = "deny"

[profile.dev.package."*"]
opt-level = 3
