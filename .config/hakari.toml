hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

resolver = "2"

platforms = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]

unify-target-host = "unify-if-both"

# The random-number crates need a JavaScript backend on wasm32. Without
# this exclusion, workspace-hack gives them to nit-wasm, whether or not
# it uses a crate that depends on them.
[final-excludes]
third-party = [
  { name = "getrandom" },
  { name = "rand" },
  { name = "rand_core" },
]
