name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  # Enumerate the commits to check: every commit the event introduces, oldest
  # first. For a pull request or a merge queue entry that is base..head; for a
  # push it is the range the push advanced (before..after), falling back to
  # just the tip when the before-sha is unknown (e.g. a brand-new branch).
  commits:
    runs-on: ubuntu-latest
    outputs:
      shas: ${{ steps.list.outputs.shas }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            shas=$(git rev-list --reverse "$BASE..$HEAD" | jq -R . | jq -cs .)
          else
            shas=$(git rev-list -n 1 "$HEAD" | jq -R . | jq -cs .)
          fi
          echo "shas=$shas" >> "$GITHUB_OUTPUT"

  # Build and run the full check suite on each commit, in parallel — one runner
  # per commit. fail-fast is off so every commit is reported, not just the
  # first to break.
  check:
    needs: commits
    if: ${{ needs.commits.outputs.shas != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.commits.outputs.shas) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
      - uses: DeterminateSystems/nix-installer-action@main
      # Only a push to main writes to the cache. Every other event only reads
      # from it.
      - uses: cachix/cachix-action@v17
        with:
          name: nit-ci-cache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: nix build
      - run: nix flake check

  # Checks the version against the contract changes since the last release,
  # when the version differs from the newest release tag. It needs every tag
  # and the commits they point at. A push to main runs the same check in the
  # release workflow.
  semver:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: nit-ci-cache
          skipPush: true
      - run: nix run .#release-check

  # The single, stable status check that branch protection requires. It
  # passes only when every per-commit check job above passed, or when there
  # was nothing to check.
  nix:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: |
          result='${{ needs.check.result }}'
          echo "per-commit checks: $result"
          case "$result" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
